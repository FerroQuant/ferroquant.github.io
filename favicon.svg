<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- FerroQuant Favicon - BCC Crystal Lattice with Dark Mode Support -->
  <style>
    .edge { stroke: #000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .inner { stroke: #000; stroke-width: 1.2; stroke-opacity: 0.5; fill: none; }
    .node { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #fff; }
      .inner { stroke: #fff; }
      .node { fill: #fff; }
    }
  </style>

  <!-- CUBE EDGES -->
  <line class="edge" x1="50" y1="17" x2="88" y2="39"/>
  <line class="edge" x1="88" y1="39" x2="50" y2="61"/>
  <line class="edge" x1="50" y1="61" x2="12" y2="39"/>
  <line class="edge" x1="12" y1="39" x2="50" y2="17"/>
  <line class="edge" x1="50" y1="39" x2="88" y2="61"/>
  <line class="edge" x1="88" y1="61" x2="50" y2="83"/>
  <line class="edge" x1="50" y1="83" x2="12" y2="61"/>
  <line class="edge" x1="12" y1="61" x2="50" y2="39"/>
  <line class="edge" x1="50" y1="17" x2="50" y2="39"/>
  <line class="edge" x1="88" y1="39" x2="88" y2="61"/>
  <line class="edge" x1="50" y1="61" x2="50" y2="83"/>
  <line class="edge" x1="12" y1="39" x2="12" y2="61"/>

  <!-- CENTER-TO-CORNER -->
  <line class="inner" x1="50" y1="50" x2="50" y2="17"/>
  <line class="inner" x1="50" y1="50" x2="88" y2="39"/>
  <line class="inner" x1="50" y1="50" x2="50" y2="61"/>
  <line class="inner" x1="50" y1="50" x2="12" y2="39"/>
  <line class="inner" x1="50" y1="50" x2="50" y2="39"/>
  <line class="inner" x1="50" y1="50" x2="88" y2="61"/>
  <line class="inner" x1="50" y1="50" x2="50" y2="83"/>
  <line class="inner" x1="50" y1="50" x2="12" y2="61"/>

  <!-- NODES -->
  <circle class="node" cx="50" cy="17" r="4"/>
  <circle class="node" cx="88" cy="39" r="4"/>
  <circle class="node" cx="50" cy="61" r="3.5"/>
  <circle class="node" cx="12" cy="39" r="4"/>
  <circle class="node" cx="50" cy="39" r="3"/>
  <circle class="node" cx="88" cy="61" r="3.5"/>
  <circle class="node" cx="50" cy="83" r="4"/>
  <circle class="node" cx="12" cy="61" r="3.5"/>
  <circle class="node" cx="50" cy="50" r="6"/>
</svg>
