<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FerroQuant — Algorithmic Trading Signals</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="178 quantitative strategies across crypto, forex, stock indices and commodities. Institutional-grade algorithmic trading signals for everyone.">
  <meta property="og:title" content="Ferroquant — Algorithmic Trading Signals">
  <meta property="og:description" content="Vote on live crypto trading signals from a real algorithmic engine. Track accuracy, build streaks, climb the leaderboard.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ferroquant.github.io">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .hero { text-align: center; max-width: 700px; }
    .logo { height: 56px; margin-bottom: 1.5rem; }
    h1 {
      font-size: 3.5rem;
      font-weight: 900;
      color: #00ff6a;
      letter-spacing: -1px;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.3rem;
      color: #8b949e;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 800; color: #00ff6a; }
    .stat-label { font-size: 0.85rem; color: #8b949e; margin-top: 0.25rem; }
    .cta {
      display: inline-block;
      background: #00ff6a;
      color: #0d1117;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      margin: 0.5rem;
      transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.85; }
    .cta-secondary {
      background: transparent;
      border: 2px solid #30363d;
      color: #e6edf3;
    }
    .cta-secondary:hover { border-color: #00ff6a; }
    footer {
      position: fixed;
      bottom: 1.5rem;
      color: #484f58;
      font-size: 0.8rem;
    }
    footer a { color: #8b949e; text-decoration: none; margin: 0 0.75rem; }
    footer a:hover { color: #00ff6a; }
  </style>
</head>
<body>
  <div class="hero">
    <img class="logo" src="/logo-horizontal.svg" alt="FerroQuant">
    <h1>Ferroquant</h1>
    <p class="tagline">
      Predict the market. Beat the algorithm.<br>
      Vote on live crypto trading signals and compete with the community.
    </p>
    <div class="stats">
      <div class="stat"><div class="stat-value">178</div><div class="stat-label">Strategies</div></div>
      <div class="stat"><div class="stat-value">1,056+</div><div class="stat-label">Instruments</div></div>
      <div class="stat"><div class="stat-value">7</div><div class="stat-label">Years of Data</div></div>
      <div class="stat"><div class="stat-value">5</div><div class="stat-label">Markets</div></div>
    </div>
    <a href="https://ferroquant.com" class="cta">Start Free →</a>
    <a href="/research" class="cta cta-secondary">The Science</a>
    <a href="/whitepaper" class="cta cta-secondary">Whitepaper</a>
    <a href="https://www.reddit.com/r/ferroquant_dev" class="cta cta-secondary">Reddit</a>
  </div>
  <footer>
    <a href="/terms">Terms</a>
    <a href="/privacy">Privacy</a>
    <span>2026 Ferroquant</span>
  </footer>
</body>
